<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Martel+Sans:wght@600&family=Poppins:wght@300;400;600;700&display=swap');

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: black;
            color: white;
            overflow-x: hidden;
        }

        .main {
            background-image: url("assets/background.jpg");
            background-position: center center;
            background-size: max(1200px, 100vw);
            background-repeat: no-repeat;
            height: 644px;
            position: relative;
        }

        .main .box {
            height: 644px;
            width: 100%;
            opacity: 0.69;
            position: absolute;
            top: 0;
            background-color: black;
        }

        nav {
            max-width: 75vw;
            justify-content: space-between;
            margin: auto;
            display: flex;
            align-items: center;
            height: 100px;
        }

        nav img {
            width: 130px;
            position: relative;
            z-index: 10;
        }

        nav button {
            position: relative;
            z-index: 10;
        }

        .hero {
            font-family: 'Martel Sans', sans-serif;
            height: calc(100% - 100px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            position: relative;
            z-index: 10;
            gap: 16px;
            padding: 0 30px;
        }

        .hero> :nth-child(1),
        .hero> :nth-child(2) {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 40px;
            text-align: center;
        }

        .hero> :nth-child(3),
        .hero> :nth-child(4) {
            font-weight: 400;
            font-size: 18px;
            text-align: center;
        }

        .separation {
            height: 7px;
            background-color: rgb(46, 44, 44);
            position: relative;
            z-index: 10;
        }

        .btn {
            padding: 6px 16px;
            font-weight: 400;
            color: white;
            background-color: rgba(248, 243, 243, 0.021);
            border-radius: 4px;
            border: 1px solid white;
            cursor: pointer;
        }

        .btn-red {
            font-weight: 600;
            background-color: red;
            padding: 10px 24px;
            font-size: 18px;
            border-radius: 4px;
            border: none;
        }

        .btn-red-sm {
            background-color: red;
            color: white;
            padding: 6px 16px;
            border-radius: 4px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .em {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            color: white;
            border: 1px solid rgba(246, 238, 238, 0.5);
            background: rgba(0, 0, 0, 0.6);
            width: 300px;
        }

        .container {
            max-width: 80vw;
            margin: 40px auto 100px auto;
        }

        .section-title {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .slider {
            display: flex;
            gap: 30px;
            overflow-x: auto;
            padding-bottom: 20px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            ;
        }

        .slider::-webkit-scrollbar {
            display: none;
        }

        .card {


position: relative;

            width: 196px;
            flex: 0 0 auto;
            height: 312px;
            scroll-snap-align: start;
            border-radius: 8px;
            overflow: visible;
            padding: 15px 10px;

        }
        }

        .card img {

            height: 100%;
            width: 100%;
            object-fit: cover;
            display: block;
            border-radius: 8px;

        }

        .number {
            font-size: 90px;
            position: absolute;
            font-weight: bold;

            bottom: 15px;
            left: -5px;
            color: black;
            -webkit-text-stroke: 2px white;
        }
    </style>
</head>

<body>

    <div class="main">
        <nav>
            <span><img src="assets/logo.svg" alt="Netflix Logo"></span>
            <div>
                <button class="btn">English</button>
                <button class="btn-red-sm">Sign in</button>
            </div>
        </nav>
        <div class="box"></div>
        <div class="hero">
            <span>Unlimited movies, TV</span>
            <span>shows, and more</span>
            <span>Starts at ₹149. Cancel anytime.</span>
            <span>Ready to watch? Enter your email to create or restart your membership.</span>
            <div>
                <input type="text" placeholder="Email Address" class="em">
                <button class="btn-red">Get Started &gt;</button>
            </div>
        </div>
    </div>

    <div class="separation"></div>

    <div class="container">
        <div class="section-title">Trending Now</div>
        <div class="slider">

            <div class="card">
                <img src="assets/img1.webp" alt="Movie 1">
                <div class="number">1</div>
            </div>

            <div class="card">
                <img src="assets/img2.webp" alt="Movie 2">
                <div class="number">2</div>
            </div>

            <div class="card">
                <img src="assets/img3.webp" alt="Movie 3">
                <div class="number">3</div>
            </div>

            <div class="card">
                <img src="assets/img4.webp" alt="Movie 4">
                <div class="number">4</div>
            </div>

            <div class="card">
                <img src="assets/img5.webp" alt="Movie 5">
                <div class="number">5</div>
            </div>

            <div class="card">
                <img src="assets/img6.webp" alt="Movie 6">
                <div class="number">6</div>
            </div>

            <div class="card">
                <img src="assets/img7.webp" alt="Movie 7">
                <div class="number">7</div>
            </div>

            <div class="card">
                <img src="assets/img8.webp" alt="Movie 8">
                <div class="number">8</div>
            </div>

            <div class="card">
                <img src="assets/img9.webp" alt="Movie 9">
                <div class="number">9</div>
            </div>

            <div class="card">
                <img src="assets/img10.webp" alt="Movie 10">
                <div class="number">10</div>
            </div>

        </div>
    </div>

</body>

</html>
